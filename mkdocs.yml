site_name: "Spark · MinIO · SQL Server"
site_description: "Pipeline de dados: SQL Server → landing-zone (CSV) → bronze (Delta Lake)"
site_author: "Gustavo Felisbino e Lucas Oliverio"

repo_url: https://github.com/gustavofelisbino/Apache-Spark-com-MINIO-e-SQL
repo_name: gustavofelisbino/Apache-Spark-com-MINIO-e-SQL
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
    - toc.follow
    - header.autohide
  icon:
    repo: fontawesome/brands/github
    logo: material/database-arrow-right
  font:
    text: Inter
    code: JetBrains Mono

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Início: index.md
  - Arquitetura: arquitetura.md
  - Notebooks:
      - "00 - Setup SQL Server": notebooks/00_setup.md
      - "01 - Extração": notebooks/01_extracao.md
      - "02 - Bronze Delta": notebooks/02_bronze.md
      - "03 - DML Delta": notebooks/03_dml.md
